# Java 业务仓 Release PR CI 模板（复制为 .github/workflows/ci.yml）
# verify → workers-world/java-actions；其余 job → workers-world/worker-actions
# pin: actions/v0.5.0（禁止 @master）
name: CI

on:
  push:
    branches: ["dev_*"]
  pull_request:
    branches: ["master"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    permissions:
      contents: read
      packages: read
    uses: workers-world/java-actions/.github/workflows/java-maven-verify.yml@actions/v0.5.0
    secrets: inherit
    with:
      github_packages_repos: framework-sdk:github-framework-sdk,framework-sdk-llm:github-framework-sdk-llm,db-init-flyway-spring-boot-starter:github-db-init-flyway
      enable_mysql: true
      upload_jacoco: true

  ensure-release-pr:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'dev_')
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-ensure-release-pr.yml@actions/v0.1.2
    secrets: inherit
    with:
      release_branch: ${{ github.ref_name }}

  qodana:
    if: |
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      startsWith(github.head_ref, 'dev_') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    uses: workers-world/worker-actions/.github/workflows/worker-qodana-scan.yml@actions/v0.1.2
    secrets: inherit
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}

  ocr:
    if: |
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      startsWith(github.head_ref, 'dev_') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      # nested open-code-review 需 actions: write（actions/cache session save）
      actions: write
    uses: workers-world/worker-actions/.github/workflows/open-code-review.yml@actions/v0.1.2
    secrets: inherit
    with:
      rule: .opencodereview/rule.json

  release-auto-merge:
    needs: [verify, qodana, ocr]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      startsWith(github.head_ref, 'dev_') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      needs.verify.result == 'success' &&
      needs.qodana.result == 'success' &&
      needs.ocr.result == 'success'
    permissions: {}
    uses: workers-world/worker-actions/.github/workflows/worker-release-auto-merge.yml@actions/v0.1.2
    secrets: inherit
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_ref: ${{ github.head_ref }}

  notify-blocked:
    needs: [verify, qodana, ocr, release-auto-merge]
    # nested notify 拉 annotations 需要 checks/actions: read；caller 须授予（不可 permissions: {}）
    permissions:
      actions: read
      checks: read
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","synchronize","reopened","ready_for_review"]'), github.event.action) &&
      github.base_ref == 'master' &&
      startsWith(github.head_ref, 'dev_') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      needs.release-auto-merge.result != 'success' &&
      needs.verify.result != 'cancelled' &&
      needs.qodana.result != 'cancelled' &&
      needs.ocr.result != 'cancelled' &&
      (
        needs.verify.result == 'failure' ||
        needs.qodana.result == 'failure' ||
        needs.ocr.result == 'failure' ||
        needs.release-auto-merge.result == 'failure' ||
        (
          needs.release-auto-merge.result == 'skipped' &&
          needs.verify.result == 'success' &&
          needs.qodana.result == 'success' &&
          needs.ocr.result == 'success'
        )
      )
    uses: workers-world/worker-actions/.github/workflows/worker-notify-release-pr-blocked.yml@actions/v0.1.2
    secrets: inherit
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number) }}
      head_ref: ${{ github.head_ref }}
      pr_url: ${{ github.event.pull_request.html_url }}
      verify_result: ${{ needs.verify.result }}
      qodana_result: ${{ needs.qodana.result }}
      ocr_result: ${{ needs.ocr.result }}
      merge_result: ${{ needs.release-auto-merge.result }}
