# zizmor 基线配置（https://docs.zizmor.sh/configuration/）
# 由 workflow-lint 的 zizmor 步骤读取（--min-severity medium 起判）。
# 注意：
# - composite action（.github/actions/**）内的发现不能用本文件抑制，须用行内注释
#   `# zizmor: ignore[<rule>]`（已就地标注理由）。
# - 本文件 ignore 按「基文件名」匹配 workflow；每条须注明理由，
#   新增前先核对对应变更，勿把新告警静默吞掉。
rules:
  # GitHub 第一方 actions/* 受官方供应链保护，允许 tag pin（Dependabot 周更 + cooldown）；
  # workers-world/* 是本 org 自有 bundle，其 actions/vX.Y.Z tag 即版本设计本身
  # （git tag 为权威制品，release-actions-bundle 打出后不可变，见 docs/actions-releases.md）；
  # 其余来源默认 hash-pin（第三方一律 full SHA，如 anchore/sbom-action）
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "workers-world/*": ref-pin

  # persist-credentials 按设计保持 true：release-actions-bundle 需 push tag + manifest 分支
  # （其余 workflow 的 checkout 均已 persist-credentials: false）
  artipacked:
    ignore:
      - release-actions-bundle.yml
