name: Release actions bundle

# 合入 master（且变更触及可复用 workflow/action 或版本号）后自动打不可变 tag actions/vX.Y.Z。
# 版本权威 = package.json version（对齐 SDK / worker-actions 语义）：Release PR 里本地 bump，bump 了才发，未 bump 跳过。
# 也可 workflow_dispatch 指定版本。Worker 仓 pin 该 tag，勿再用 @master。
# manifest 经 PR 回填（master 禁止直推）。见 docs/actions-releases.md
# 鉴权：配置 RELEASE_BOT_APP_ID（Variable）+ RELEASE_BOT_PRIVATE_KEY（Secret）即自动走
# release-bot GitHub App（短时 installation token，tag push 可触发下游 gh-release-on-tag）；
# 未配置时回落 GHA_TOKEN/GITHUB_TOKEN（行为同迁移前）。
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      version:
        description: 可选。留空则读 package.json version；填写如 0.5.0 → tag actions/v0.5.0
        required: false
        type: string
        default: ""

# 写权限仅 tag job 需要；gate 只读 commit subject（对齐 worker-actions，避免 workflow 级 permissions 导致 GHA 不注册）
permissions: {}

concurrency:
  group: release-actions-bundle
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$SUBJECT" == *'[skip actions-release]'* ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skip release: commit subject contains [skip actions-release]"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  tag:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
      pull-requests: write
    if: >
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          needs.gate.result == 'success' &&
          needs.gate.outputs.proceed == 'true'
        )
      )
    env:
      RELEASE_BOT_APP_ID_EFFECTIVE: ${{ vars.RELEASE_BOT_APP_ID }}
    steps:
      # App 通道（可选）：配置 RELEASE_BOT_APP_ID 变量 + RELEASE_BOT_PRIVATE_KEY Secret 后自动启用；
      # 未配置时保持 GHA_TOKEN/GITHUB_TOKEN。tag push 须由 App/PAT 发起（GITHUB_TOKEN 不触发下游 workflow）
      - name: Mint GitHub App token
        id: bot-token
        if: env.RELEASE_BOT_APP_ID_EFFECTIVE != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ env.RELEASE_BOT_APP_ID_EFFECTIVE }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          # owner/repositories 均不传 → token 仅限当前仓（v3 语义；zizmor github-app 要求）
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/ensure-gh-cli

      - name: Resolve version, create tag, open manifest PR
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GHA_TOKEN || secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          REF="$(git rev-parse HEAD)"
          # 版本权威 = package.json version（对齐 SDK：本地 bump 才发版；未 bump 跳过，勿再 patch+1 / manifest seed）
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "${PKG_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version 须为 X.Y.Z，当前: ${PKG_VERSION}"
            exit 1
          fi

          # 当前 commit 已有 tag（例如上次 run 已打 tag、manifest 推送失败）→ 只回填 PR，勿重复发版
          existing_on_head="$(git tag -l 'actions/v*' --points-at "$REF" | sort -t. -k1,1 -k2,2n -k3,3n | tail -1 || true)"
          if [ -n "${INPUT_VERSION}" ]; then
            # workflow_dispatch 指定版本：minor/major 或应急通道
            if ! [[ "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version 须为 X.Y.Z，当前: ${INPUT_VERSION}"
              exit 1
            fi
            VERSION="${INPUT_VERSION}"
            TAG="actions/v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "::error::tag 已存在: ${TAG}（workflow_dispatch 指定版本时勿重复）"
              exit 1
            fi
            echo "workflow_dispatch specified version: ${VERSION}"
          elif [ -n "${existing_on_head}" ]; then
            TAG="${existing_on_head}"
            VERSION="${TAG#actions/v}"
            echo "HEAD already tagged ${TAG}; sync manifest PR only"
          elif git rev-parse "actions/v${PKG_VERSION}" >/dev/null 2>&1; then
            # package.json 未 bump（该版本已发过）→ 跳过发版（对齐 SDK：版本没变不 publish/tag）
            TAG="actions/v${PKG_VERSION}"
            VERSION="${PKG_VERSION}"
            echo "Skip release: ${TAG} already exists; bump package.json version to release"
            {
              echo "### Actions bundle release skipped"
              echo ""
              echo "- package.json version \`${PKG_VERSION}\` 已发布为 \`${TAG}\`，本次合入未 bump 版本号，未打新 tag。"
              echo "- 下次发版：在 Release PR 里 bump \`package.json\` 的 \`version\`（如 \`0.5.5\`）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            VERSION="${PKG_VERSION}"
            echo "Release version from package.json: actions/v${VERSION}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version 须为 X.Y.Z，当前: ${VERSION}"
            exit 1
          fi

          TAG="actions/v${VERSION}"
          TAG_CREATED=0

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            REF="$(git rev-list -n 1 "$TAG")"
            echo "Tag ${TAG} already exists at ${REF}"
            if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_VERSION}" ]; then
              echo "::error::tag 已存在: ${TAG}（workflow_dispatch 指定版本时勿重复）"
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Actions bundle ${TAG}"
            git push origin "$TAG"
            TAG_CREATED=1
            echo "Created ${TAG} at ${REF}"
          fi

          # master 禁止直推：开 PR 回填 manifest（tag 已是权威来源）
          MANIFEST="manifest/actions-bundle.yaml"
          TODAY="$(date -u +%Y-%m-%d)"
          BRANCH="chore/actions-bundle-${VERSION}"

          write_manifest() {
            mkdir -p "$(dirname "$MANIFEST")"
            {
              echo "# Actions bundle 当前版本（Worker 仓 pin 此 tag）"
              echo "# 完整变更见 docs/actions-releases.md；权威来源为 git tag"
              echo "current: ${TAG}"
              echo "sha: \"${REF}\""
              echo "released_at: \"${TODAY}\""
              echo "notes: |"
              if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "  Released via workflow_dispatch."
              else
                echo "  Auto-released on push to master (actions paths changed)."
              fi
            } > "$MANIFEST"
          }

          git fetch origin master
          git checkout -B "$BRANCH" origin/master
          write_manifest
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Manifest already up to date on master"
          else
            git commit -m "chore: bump actions bundle manifest to ${TAG} [skip actions-release]"
            git push -u origin "$BRANCH" --force-with-lease
            existing="$(gh pr list --repo "$REPO" --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              echo "Manifest PR already open: #${existing}"
            else
              gh pr create --repo "$REPO" \
                --base master \
                --head "$BRANCH" \
                --title "chore: actions bundle manifest ${TAG}" \
                --body "$(cat <<EOF
          ## Actions bundle manifest

          - Tag: \`${TAG}\`（已存在于远程）
          - SHA: \`${REF}\`
          - tag_created_this_run: ${TAG_CREATED}

          master 禁止直推，故经 PR 回填。合入即可；commit 含 \`[skip actions-release]\`，不会再打 tag。
          EOF
          )"
              echo "Opened manifest PR for ${TAG}"
            fi
          fi

          {
            echo "### Actions bundle released"
            echo ""
            echo "- **Tag**: \`${TAG}\` (created_this_run=${TAG_CREATED})"
            echo "- **SHA**: \`${REF}\`"
            echo "- Worker bump: \`@${TAG}\`"
            echo "- Manifest: PR branch \`${BRANCH}\`（勿直推 master）"
          } >> "$GITHUB_STEP_SUMMARY"
