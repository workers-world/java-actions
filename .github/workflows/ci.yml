name: CI

# 公开仓 dogfood：fork PR 只跑无 secret 的 lint；禁止 uses:./ + secrets:inherit。
# 打 tag 由 release-actions-bundle.yml 在 push master 时单独触发。
on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "templates/**"
      - "manifest/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml
    with:
      runner: ubuntu-latest

  # 发版闸：PR 触及产品文件须 bump package.json version（版本权威，bump 了才发）
  release-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # 需 diff PR base 与全量 tag
          fetch-depth: 0
      - env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: node .github/scripts/check-release-bump.mjs --base="$BASE_BRANCH" --tag-prefix=actions/v
